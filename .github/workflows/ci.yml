name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        if: runner.os == 'Linux'
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

  # The jobs below only run when build succeeds on a "v*" tag push.
  cross-compile:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X 'github.com/Fanatic-zer0/tfsum/internal/cli.Version=${GITHUB_REF_NAME}'" \
            -o "dist/tfsum${ext}" ./cmd/tfsum

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: tfsum_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  package:
    needs: cross-compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download raw binaries
        uses: actions/download-artifact@v4
        with:
          path: raw
          pattern: tfsum_*
          merge-multiple: false

      - name: Archive each platform binary
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in raw/*/; do
            name="$(basename "$dir")"           # tfsum_<goos>_<goarch>
            platform="${name#tfsum_}"            # <goos>_<goarch>
            archive_base="tfsum_${GITHUB_REF_NAME}_${platform}"
            if [[ "$platform" == windows_* ]]; then
              (cd "$dir" && zip -q "../../dist/${archive_base}.zip" tfsum.exe)
            else
              (cd "$dir" && chmod +x tfsum && tar -czf "../../dist/${archive_base}.tar.gz" tfsum)
            fi
          done
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
