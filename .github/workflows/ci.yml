name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        if: runner.os == 'Linux'
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

  # The jobs below only run when build succeeds on a "v*" tag push.
  cross-compile:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X 'github.com/Fanatic-zer0/tfsum/internal/cli.Version=${GITHUB_REF_NAME}'" \
            -o "dist/tfsum${ext}" ./cmd/tfsum

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: tfsum_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  package:
    needs: cross-compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download raw binaries
        uses: actions/download-artifact@v4
        with:
          path: raw
          pattern: tfsum_*
          merge-multiple: false

      - name: Archive each platform binary
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in raw/*/; do
            name="$(basename "$dir")"           # tfsum_<goos>_<goarch>
            platform="${name#tfsum_}"            # <goos>_<goarch>
            archive_base="tfsum_${GITHUB_REF_NAME}_${platform}"
            if [[ "$platform" == windows_* ]]; then
              (cd "$dir" && zip -q "../../dist/${archive_base}.zip" tfsum.exe)
            else
              (cd "$dir" && chmod +x tfsum && tar -czf "../../dist/${archive_base}.tar.gz" tfsum)
            fi
          done

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .deb/.rpm packages (linux only)
        env:
          NFPM_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            export NFPM_ARCH="${arch}"
            export NFPM_BINARY="raw/tfsum_linux_${arch}/tfsum"
            chmod +x "${NFPM_BINARY}"
            for pkg in deb rpm; do
              nfpm package --config packaging/nfpm.yaml --packager "${pkg}" --target "dist/"
            done
          done

      - name: Checksum all release assets
        run: cd dist && sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  homebrew-tap:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS/Linux release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'checksums.txt' \
            --dir assets

      - name: Render Homebrew formula
        id: render
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          darwin_amd64_sha="$(grep '_darwin_amd64.tar.gz' assets/checksums.txt | awk '{print $1}')"
          darwin_arm64_sha="$(grep '_darwin_arm64.tar.gz' assets/checksums.txt | awk '{print $1}')"
          linux_amd64_sha="$(grep '_linux_amd64.tar.gz' assets/checksums.txt | awk '{print $1}')"
          linux_arm64_sha="$(grep '_linux_arm64.tar.gz' assets/checksums.txt | awk '{print $1}')"
          mkdir -p formula
          sed \
            -e "s/{{VERSION}}/${version}/g" \
            -e "s/{{TAG}}/${tag}/g" \
            -e "s/{{DARWIN_AMD64_SHA}}/${darwin_amd64_sha}/g" \
            -e "s/{{DARWIN_ARM64_SHA}}/${darwin_arm64_sha}/g" \
            -e "s/{{LINUX_AMD64_SHA}}/${linux_amd64_sha}/g" \
            -e "s/{{LINUX_ARM64_SHA}}/${linux_arm64_sha}/g" \
            packaging/homebrew/tfsum.rb.tmpl > formula/tfsum.rb

      - name: Publish formula to homebrew-tfsum tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping tap publish." >&2
            exit 1
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Fanatic-zer0/homebrew-tfsum.git" tap
          cp formula/tfsum.rb tap/Formula/tfsum.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tfsum.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, nothing to publish."
            exit 0
          fi
          git commit -m "tfsum ${GITHUB_REF_NAME}"
          git push origin HEAD:main
